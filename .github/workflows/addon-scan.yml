name: Add-on virus scan

on:
  schedule:
    - cron: '17 3 * * *'  # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true

      - name: Update ClamAV signatures
        # If the signature download fails the scan still runs, and files are reported as "Unknown"
        continue-on-error: true
        run: sudo freshclam

      - name: Scan add-ons
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          MIN_DETECTIONS: '2'
        run: python scripts/scan_addons.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Addons.ini AddonsScan.ini
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update add-on virus scan results"
            git push
          fi
