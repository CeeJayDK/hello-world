name: Add-on virus scan

on:
  schedule:
    - cron: '17 3 * * *'  # daily at 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - Addons.ini  # scan new or changed add-ons right away (the scan's own commits don't re-trigger it)

permissions:
  contents: write

concurrency:
  group: addon-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Start from crosire's current list. Previously commented-out add-ons are re-scanned and stay
      # disabled only if still infected. Skipped on push, so manual edits to Addons.ini can be tested.
      - name: Refresh Addons.ini from crosire/reshade-shaders
        if: github.event_name != 'push'
        continue-on-error: true  # scan the existing copy if the download fails
        run: |
          curl -fsSL https://raw.githubusercontent.com/crosire/reshade-shaders/list/Addons.ini -o "$RUNNER_TEMP/Addons.ini"
          mv "$RUNNER_TEMP/Addons.ini" Addons.ini

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true

      - name: Update ClamAV signatures
        # If the signature download fails the scan still runs, with ClamAV reported as "Unknown"
        continue-on-error: true
        run: sudo freshclam

      - name: Scan add-ons
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}  # for reading GitHub releases
          MIN_DETECTIONS: '2'
          VT_BUDGET: '250'  # free tier allows 500 requests/day, leave room for manual runs
        run: python scripts/scan_addons.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Addons.ini AddonsScan.ini $(ls VirusTotalCache.json 2>/dev/null)
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update add-on virus scan results"
            git pull --rebase
            git push
          fi

      # A failed run makes GitHub send an email alert (Settings > Notifications > Actions)
      - name: Alert on infected add-ons
        if: steps.scan.outputs.infected != '0'
        run: |
          echo "::error::${{ steps.scan.outputs.infected }} infected add-on(s) found and commented out in Addons.ini - see the run summary"
          exit 1
